name: Promover Wiki a main

# Arregla el problema de "Sísifo": las sesiones de routine ingestan artículos
# pero sus commits van a ramas claude/** y nunca llegaban a main.
# Este workflow detecta pushes de wiki/ en esas ramas y promueve SOLO
# wiki/ + sources/processed.json a main (rutas restringidas por seguridad).

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "wiki/**"
      - "sources/processed.json"

concurrency:
  group: promote-wiki-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: "Promover wiki/ + processed.json → main"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout de la rama que hizo push, con historia completa.
      # El commit disparador ($GITHUB_SHA) queda disponible localmente.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promover contenido de wiki a main
        run: |
          set -e
          SRC_SHA="${GITHUB_SHA}"
          SRC_REF="${GITHUB_REF_NAME}"
          echo "Promoviendo wiki desde $SRC_REF ($SRC_SHA)"

          git config user.name "wiki-agro-bot"
          git config user.email "wiki-agro-bot@users.noreply.github.com"

          # Asegurar rama main local a partir de origin/main
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

          # Traer SOLO estas rutas desde el commit disparador (ya es local)
          git checkout "$SRC_SHA" -- wiki/ sources/processed.json

          if git diff --staged --quiet; then
            echo "ℹ Sin cambios de wiki para promover"
            exit 0
          fi

          PAGES=$(git diff --staged --name-only | grep -c "wiki/" || true)
          git commit -m "wiki: promover ingest desde ${SRC_REF} (${PAGES} archivos) [skip ci]"

          # Reintento con rebase por si otra promoción entró en paralelo
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "✓ promovido a main"
              break
            fi
            echo "reintento $i (rebase)..."
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep $((i*3))
          done
