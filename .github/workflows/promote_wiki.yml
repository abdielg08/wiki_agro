name: Promover Wiki a main

# Arregla el problema de "Sísifo": las sesiones de routine ingestan artículos
# pero sus commits van a ramas claude/** y nunca llegaban a main.
# Este workflow detecta pushes de wiki/ en esas ramas y promueve SOLO
# wiki/ + sources/processed.json a main (rutas restringidas por seguridad).

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "wiki/**"
      - "sources/processed.json"

concurrency:
  group: promote-wiki-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: "Promover wiki/ + processed.json → main"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Traer contenido de la rama que hizo push
        run: |
          set -e
          SRC_SHA="${{ github.sha }}"
          SRC_REF="${{ github.ref_name }}"
          echo "Promoviendo desde $SRC_REF ($SRC_SHA)"
          git fetch origin "$SRC_SHA" --depth=1

          # Traer SOLO estas rutas (seguridad: nunca código ni workflows)
          git checkout "$SRC_SHA" -- wiki/ sources/processed.json || true

          git config user.name "wiki-agro-bot"
          git config user.email "wiki-agro-bot@users.noreply.github.com"

          if git diff --staged --quiet && git diff --quiet; then
            echo "ℹ Sin cambios de wiki para promover"
            exit 0
          fi

          git add wiki/ sources/processed.json
          if git diff --staged --quiet; then
            echo "ℹ Nada nuevo tras staging"
            exit 0
          fi

          PAGES=$(git diff --staged --name-only | grep -c "wiki/" || true)
          git commit -m "wiki: promover ingest desde ${SRC_REF} (${PAGES} archivos) [skip ci]"

          # Reintento con rebase por si otra promoción entró en paralelo
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "reintento $i..."; sleep $((i*3))
          done
