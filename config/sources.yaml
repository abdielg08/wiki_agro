# Fuentes de noticias agropecuarias para Panamá
# Niveles de confianza: 1=oficial, 2=internacional, 3=nacional, 4=internacional_cobertura

sources:

  official:
    - name: "MIDA"
      full_name: "Ministerio de Desarrollo Agropecuario de Panamá"
      url: "https://www.mida.gob.pa"
      rss: null
      news_path: "/noticias"
      trust_level: 1
      language: "es"
      country: "PA"

    - name: "IDIAP"
      full_name: "Instituto de Investigación Agropecuaria de Panamá"
      url: "https://www.idiap.gob.pa"
      rss: null
      news_path: "/noticias"
      trust_level: 1
      language: "es"
      country: "PA"

    - name: "BDA"
      full_name: "Banco de Desarrollo Agropecuario"
      url: "https://www.bda.gob.pa"
      rss: null
      trust_level: 1
      language: "es"
      country: "PA"

  international:
    - name: "IICA"
      full_name: "Instituto Interamericano de Cooperación para la Agricultura"
      url: "https://www.iica.int"
      rss: "https://www.iica.int/es/rss/noticias"
      trust_level: 2
      language: "es"
      country: "INT"
      query_params:
        country_filter: "panama"

    - name: "FAO_LAC"
      full_name: "FAO América Latina y el Caribe"
      url: "https://www.fao.org/americas/es/"
      rss: null
      trust_level: 2
      language: "es"
      country: "INT"

  national_media:
    - name: "La Prensa"
      full_name: "La Prensa de Panamá"
      url: "https://www.prensa.com"
      rss: "https://www.prensa.com/feed/"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "Panama America"
      full_name: "Panamá América"
      url: "https://www.panamaamerica.com.pa"
      rss: "https://www.panamaamerica.com.pa/feed"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "TVN Noticias"
      full_name: "TVN-2 Noticias"
      url: "https://www.tvn-2.com"
      rss: "https://www.tvn-2.com/feed"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "La Estrella"
      full_name: "La Estrella de Panamá"
      url: "https://www.laestrella.com.pa"
      rss: "https://www.laestrella.com.pa/feed"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "El Siglo"
      full_name: "El Siglo Panamá"
      url: "https://www.elsiglo.com.pa"
      rss: null
      trust_level: 3
      language: "es"
      country: "PA"

# Términos de búsqueda para filtrar noticias agrícolas
# Se usarán como filtros en RSS y búsquedas GDELT
search_terms:
  primary:
    - "agropecuario"
    - "agricultura"
    - "ganadería"
    - "MIDA"
    - "cosecha"
    - "cultivo"
  secondary:
    - "arroz"
    - "maíz"
    - "plátano"
    - "ganadero"
    - "agricultor"
    - "campo"
    - "producción agrícola"
    - "seguridad alimentaria"
    - "precios agropecuarios"
    - "sequía"
    - "café"
    - "cacao"
    - "caña de azúcar"
    - "porcicultura"
    - "avicultura"
    - "acuicultura"
    - "pesca"
    - "IDIAP"
    - "BDA"
    - "ANAGAN"

# Configuración de GDELT (base de datos global de noticias, gratuita)
gdelt:
  api_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  max_records: 250
  language: "spa"
  country_code: "PA"
  date_range:
    start: "2015-01-01"
    end: "2025-12-31"

# Configuración de años a cubrir
coverage:
  start_year: 2015
  end_year: 2025
