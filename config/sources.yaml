# Fuentes de noticias agropecuarias para Panamá
# trust_level: 1=oficial, 2=internacional, 3=nacional, 4=internacional_cobertura

sources:

  official:
    - name: "MIDA"
      full_name: "Ministerio de Desarrollo Agropecuario de Panamá"
      url: "https://www.mida.gob.pa"
      rss: null
      trust_level: 1
      language: "es"
      country: "PA"

    - name: "IDIAP"
      full_name: "Instituto de Investigación Agropecuaria de Panamá"
      url: "https://www.idiap.gob.pa"
      rss: null
      trust_level: 1
      language: "es"
      country: "PA"

    - name: "BDA"
      full_name: "Banco de Desarrollo Agropecuario"
      url: "https://www.bda.gob.pa"
      rss: null
      trust_level: 1
      language: "es"
      country: "PA"

    - name: "Contraloria"
      full_name: "Contraloría General de la República de Panamá"
      url: "https://www.contraloria.gob.pa"
      rss: null
      trust_level: 1
      language: "es"
      country: "PA"

  international:
    - name: "IICA"
      full_name: "Instituto Interamericano de Cooperación para la Agricultura"
      url: "https://www.iica.int"
      rss: "https://www.iica.int/es/rss/noticias"
      trust_level: 2
      language: "es"
      country: "INT"
      search_filter: "panama"

    - name: "OIRSA"
      full_name: "Organismo Internacional Regional de Sanidad Agropecuaria"
      url: "https://www.oirsa.org"
      rss: null
      scrape_url: "https://www.oirsa.org/contenido/news"
      trust_level: 2
      language: "es"
      country: "INT"
      # Alerta fitosanitaria y zoosanitaria en Centroamérica y el Caribe

    - name: "FAO_Panama"
      full_name: "FAO — Oficina Subregional para Mesoamérica"
      url: "https://www.fao.org/mesoamerica/es/"
      rss: "https://www.fao.org/mesoamerica/es/rss/noticias.xml"
      trust_level: 2
      language: "es"
      country: "INT"

    - name: "FAO_LAC"
      full_name: "FAO América Latina y el Caribe"
      url: "https://www.fao.org/americas/es/"
      rss: "https://www.fao.org/americas/noticias/es/rss"
      trust_level: 2
      language: "es"
      country: "INT"

    - name: "BancoMundial"
      full_name: "Banco Mundial — Panamá"
      url: "https://www.bancomundial.org/es/country/panama"
      rss: null
      # Uses World Bank API: https://search.worldbank.org/api/v2/news
      api_url: "https://search.worldbank.org/api/v2/news"
      api_params:
        qterm: "panama agricultura agropecuario"
        lang_exact: "Spanish"
        format: "json"
        rows: 50
      trust_level: 2
      language: "es"
      country: "INT"

    - name: "BID"
      full_name: "Banco Interamericano de Desarrollo — Panamá"
      url: "https://www.iadb.org/es/pais/panama"
      rss: null
      trust_level: 2
      language: "es"
      country: "INT"

    - name: "CEPAL"
      full_name: "Comisión Económica para América Latina y el Caribe"
      url: "https://www.cepal.org/es/areas-de-trabajo/agricultura"
      rss: "https://www.cepal.org/cgi-bin/getRSSAll.asp?lang=es&tipo=Noticias"
      trust_level: 2
      language: "es"
      country: "INT"

  national_media:
    - name: "LaPrensaEco"
      full_name: "La Prensa — Economía y Agropecuario"
      url: "https://www.prensa.com"
      rss: "https://www.prensa.com/economia/feed/"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "LaPrensaGeneral"
      full_name: "La Prensa de Panamá — General"
      url: "https://www.prensa.com"
      rss: "https://www.prensa.com/feed/"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "PanamaAmerica"
      full_name: "Panamá América"
      url: "https://www.panamaamerica.com.pa"
      rss: "https://www.panamaamerica.com.pa/feed"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "TVNNoticias"
      full_name: "TVN-2 Noticias"
      url: "https://www.tvn-2.com"
      rss: "https://www.tvn-2.com/feed"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "LaEstrella"
      full_name: "La Estrella de Panamá"
      url: "https://www.laestrella.com.pa"
      rss: "https://www.laestrella.com.pa/feed"
      trust_level: 3
      language: "es"
      country: "PA"

    - name: "ElCapital"
      full_name: "El Capital Financiero"
      url: "https://elcapitalfinanciero.com"
      rss: "https://elcapitalfinanciero.com/feed/"
      trust_level: 3
      language: "es"
      country: "PA"

# Búsquedas web dirigidas (DuckDuckGo, sin API key)
# Usadas para obtener artículos de sitios sin RSS público
web_searches:
  - name: "prensa_agro"
    site: "prensa.com"
    query: "agropecuario OR agricultura OR ganadería OR MIDA OR cosecha Panamá"
    max_results: 20

  - name: "oirsa_alertas"
    site: "oirsa.org"
    query: "Panamá sanidad animal vegetal alerta"
    max_results: 15

  - name: "mida_noticias"
    site: "mida.gob.pa"
    query: "producción agrícola cosecha productores"
    max_results: 15

  - name: "idiap_investigacion"
    site: "idiap.gob.pa"
    query: "variedad semilla investigación agropecuaria"
    max_results: 10

  - name: "bda_credito"
    site: "bda.gob.pa"
    query: "crédito préstamo agricultores financiamiento"
    max_results: 10

  - name: "fao_panama"
    site: "fao.org"
    query: "Panama alimentación agricultura seguridad alimentaria"
    max_results: 15

  - name: "banco_mundial_pa"
    site: "bancomundial.org"
    query: "Panama agricultura desarrollo rural"
    max_results: 10

  - name: "iica_panama"
    site: "iica.int"
    query: "Panamá agropecuario cooperación técnica"
    max_results: 15

# Términos de búsqueda para filtrar noticias agrícolas
search_terms:
  primary:
    - "agropecuario"
    - "agricultura"
    - "ganadería"
    - "MIDA"
    - "cosecha"
    - "cultivo"
  secondary:
    - "arroz"
    - "maíz"
    - "plátano"
    - "ganadero"
    - "agricultor"
    - "producción agrícola"
    - "seguridad alimentaria"
    - "precios agropecuarios"
    - "sequía"
    - "café"
    - "cacao"
    - "caña de azúcar"
    - "porcicultura"
    - "avicultura"
    - "acuicultura"
    - "pesca"
    - "IDIAP"
    - "BDA"
    - "ANAGAN"
    - "OIRSA"
    - "sanidad animal"
    - "sanidad vegetal"
    - "gusano cogollero"
    - "Sigatoka"
    - "Fusarium"
    - "riego"
    - "semillas"

# Configuración de GDELT (base de datos global de noticias, gratuita)
# Usado principalmente para el crawl histórico inicial
gdelt:
  api_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  max_records: 250
  language: "spa"
  country_code: "PA"
  date_range:
    start: "2015-01-01"
    end: "2025-12-31"

# Años de cobertura objetivo
coverage:
  start_year: 2015
  end_year: 2025
